name: DeepMap
description: DeepMap was a high-definition mapping and localization software company for autonomous vehicles, building
  HD maps, real-time localization, and map-update infrastructure that let self-driving cars know precisely where
  they were. Backed by a16z and Accel, DeepMap was acquired by NVIDIA in 2021 and folded into NVIDIA's autonomous-vehicle
  platform; the deepmap.ai domain now resolves to NVIDIA's self-driving solutions page. No independent DeepMap developer
  portal, documentation, or public API surface exists post-acquisition. This profile is retained as a network/portfolio
  record.
